name: Windows release

on:
  push:
    tags:
      - '0.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Smoke test Windows startup
        shell: pwsh
        run: |
          $appPath = Resolve-Path 'build/windows/x64/runner/Release/vola_fix.exe'
          $process = Start-Process -FilePath $appPath -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "vola_fix.exe exited during startup with code $($process.ExitCode)."
            }
            Write-Host 'vola_fix.exe stayed running during the startup smoke test.'
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Package Windows build
        shell: pwsh
        run: |
          $releaseDirectory = 'build/windows/x64/runner/Release'
          if (!(Test-Path $releaseDirectory)) {
            throw "Windows release directory not found: $releaseDirectory"
          }
          $assetPath = Join-Path $env:RUNNER_TEMP "Peaks-Fix-$env:GITHUB_REF_NAME-Windows.zip"
          Compress-Archive -Path "$releaseDirectory/*" -DestinationPath $assetPath
          "ASSET_PATH=$assetPath" >> $env:GITHUB_ENV
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:ASSET_PATH --clobber
          } else {
            gh release create $tag $env:ASSET_PATH `
              --title "Peaks Fix $tag" `
              --notes "Windows release for Peaks Fix $tag. Download and extract the ZIP, then launch vola_fix.exe. App data is stored locally on this Windows machine." `
              --latest
          }
