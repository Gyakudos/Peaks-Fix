name: vola_fix
description: "Peaks Fix — repair shop management for consoles, retro hardware, portable consoles and handheld PCs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_selector: ^1.0.3
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  path: ^1.9.1
  ffi: ^2.2.0
  crypto: ^3.0.8
  stream_channel: ^2.1.4
  web_socket_channel: ^3.0.3
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
